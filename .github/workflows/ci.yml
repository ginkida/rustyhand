name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily re-scan catches advisories published when nothing else triggers CI.
  # RustSec advisory-db updates faster than Dependabot (RUSTSEC-2026-0104
  # hit advisory-db the day before Dependabot noticed it).
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Force real cargo on PATH (macOS shim defense)
        shell: bash
        run: |
          # macos-latest runners intermittently have /opt/homebrew/bin/cargo
          # as a rustup-init shim that shadows the rustup-installed cargo
          # in $HOME/.cargo/bin. dtolnay's $GITHUB_PATH write should prepend
          # the right path, but ordering races have shipped twice now.
          # Force-prepend + assert `cargo --version` is real cargo to fail
          # fast with a useful message if the shim is still winning.
          if [ -x "$HOME/.cargo/bin/cargo" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          echo "PATH=$PATH"
          echo "which cargo: $(which cargo)"
          ver=$(cargo --version 2>&1 || true)
          echo "cargo --version: $ver"
          case "$ver" in
            cargo\ *) echo "cargo OK" ;;
            *) echo "ERROR: 'cargo' on PATH is not real cargo (got: $ver)"; exit 1 ;;
          esac
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # v3 suffix invalidates earlier caches that on macos-latest
          # captured a rustup-init shim as `cargo`. See v0.7.70 changelog.
          key: check-${{ matrix.os }}-v3
      - run: cargo check --workspace

  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Force real cargo on PATH (macOS shim defense)
        shell: bash
        run: |
          if [ -x "$HOME/.cargo/bin/cargo" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          echo "PATH=$PATH"
          echo "which cargo: $(which cargo)"
          ver=$(cargo --version 2>&1 || true)
          echo "cargo --version: $ver"
          case "$ver" in
            cargo\ *) echo "cargo OK" ;;
            *) echo "ERROR: 'cargo' on PATH is not real cargo (got: $ver)"; exit 1 ;;
          esac
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # See check job above for rationale.
          key: test-${{ matrix.os }}-v3
      - run: cargo test --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --workspace -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit

  secrets:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Install trufflehog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
      - name: Scan for secrets
        run: |
          trufflehog filesystem . \
            --no-update \
            --fail \
            --only-verified \
            --exclude-paths=<(echo -e "target/\n.git/\nCargo.lock")
